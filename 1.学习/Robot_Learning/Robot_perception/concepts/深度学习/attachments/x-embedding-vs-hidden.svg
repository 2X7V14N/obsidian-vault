<svg xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="0 0 880 720">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="880" height="720" fill="#ffffff"/>

  <!-- ============ 面板 1 ============ -->
  <rect x="30" y="30" width="820" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="55" y="68" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="bold" fill="#0f172a">① 第一层的 x：来自词嵌入表（查表）</text>

  <!-- 词元 -->
  <rect x="55" y="120" width="80" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="95" y="152" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="21" text-anchor="middle" fill="#1e3a8a">猫</text>
  <text x="95" y="192" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#64748b">文本词元</text>

  <!-- 箭头 -->
  <line x1="135" y1="145" x2="192" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="163" y="134" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#64748b">分词</text>

  <!-- 词元 ID -->
  <rect x="195" y="120" width="132" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="261" y="152" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" fill="#1e3a8a">词元 ID: 1234</text>
  <text x="261" y="192" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#64748b">整数编号</text>

  <!-- 箭头 -->
  <line x1="327" y1="145" x2="384" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="355" y="134" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#64748b">查表</text>

  <!-- 词嵌入表 -->
  <rect x="386" y="76" width="220" height="212" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="496" y="100" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" fill="#065f46">词嵌入表（V 行 × d 列）</text>

  <!-- 行 -->
  <line x1="386" y1="108" x2="606" y2="108" stroke="#a7f3d0"/>
  <line x1="446" y1="108" x2="446" y2="288" stroke="#a7f3d0"/>
  <line x1="386" y1="144" x2="606" y2="144" stroke="#d1fae5"/>
  <line x1="386" y1="180" x2="606" y2="180" stroke="#d1fae5"/>
  <line x1="386" y1="252" x2="606" y2="252" stroke="#d1fae5"/>
  <line x1="386" y1="288" x2="606" y2="288" stroke="#d1fae5"/>

  <!-- 高亮行 1234 -->
  <rect x="387" y="216" width="218" height="36" fill="#a7f3d0"/>

  <text x="416" y="131" font-family="monospace" font-size="13" text-anchor="middle" fill="#475569">0</text>
  <text x="416" y="167" font-family="monospace" font-size="13" text-anchor="middle" fill="#475569">1</text>
  <text x="416" y="203" font-family="monospace" font-size="13" text-anchor="middle" fill="#475569">2</text>
  <text x="416" y="239" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">1234</text>
  <text x="416" y="275" font-family="monospace" font-size="13" text-anchor="middle" fill="#475569">…</text>

  <text x="454" y="131" font-family="monospace" font-size="12" fill="#94a3b8">[ 0.1, 0.3, … ]</text>
  <text x="454" y="167" font-family="monospace" font-size="12" fill="#94a3b8">[ -0.4, 0.2, … ]</text>
  <text x="454" y="203" font-family="monospace" font-size="12" fill="#94a3b8">[ 0.7, -0.1, … ]</text>
  <text x="454" y="239" font-family="monospace" font-size="12" font-weight="bold" fill="#065f46">[ 0.2,-0.5, 0.8, 0.1 ]</text>
  <text x="454" y="275" font-family="monospace" font-size="12" fill="#94a3b8">[ … ]</text>

  <!-- 箭头：表 -> x -->
  <line x1="608" y1="234" x2="665" y2="234" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="674" y="228" font-family="monospace" font-size="14" font-weight="bold" fill="#1e3a8a">x₁ = [0.2, -0.5, 0.8, 0.1]</text>
  <text x="674" y="250" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">第 1234 行原样取出</text>

  <text x="55" y="312" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">本质：用整数 ID 去一张大表里「取一行」—— 这一行就是这个词元的初始 x（d 维向量）</text>

  <!-- ============ 面板 2 ============ -->
  <rect x="30" y="350" width="820" height="330" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="55" y="388" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="bold" fill="#0f172a">② 中间层的 x：上一层的输出（隐藏表示）</text>

  <!-- 输入箭头 -->
  <line x1="50" y1="480" x2="98" y2="480" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="72" y="470" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">x</text>

  <!-- 层 1 -->
  <rect x="100" y="446" width="180" height="68" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="190" y="476" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" fill="#4c1d95">Transformer</text>
  <text x="190" y="498" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" fill="#4c1d95">层 1</text>

  <!-- 箭头 1->2 -->
  <line x1="280" y1="480" x2="398" y2="480" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="292" y="404" width="110" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="347" y="422" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle" fill="#92400e">隐藏表示</text>
  <text x="339" y="470" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#4c1d95">x′</text>

  <!-- 层 2 -->
  <rect x="400" y="446" width="180" height="68" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="490" y="476" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" fill="#4c1d95">Transformer</text>
  <text x="490" y="498" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="15" text-anchor="middle" fill="#4c1d95">层 2</text>

  <!-- 箭头 2->3 -->
  <line x1="580" y1="480" x2="698" y2="480" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="639" y="470" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" fill="#4c1d95">x″</text>

  <!-- 层 3 -->
  <rect x="700" y="446" width="120" height="68" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="760" y="488" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="18" text-anchor="middle" fill="#4c1d95">…</text>

  <!-- 下方标注 -->
  <line x1="120" y1="540" x2="260" y2="540" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="562" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" fill="#475569">层1的输入 = x</text>

  <line x1="420" y1="540" x2="560" y2="540" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="490" y="562" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle" fill="#475569">层2的输入 = 层1的输出 x′</text>

  <text x="55" y="620" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">关键：形状完全相同（都是「每个词元一个 d 维向量」），区别只在「来源」——</text>
  <text x="55" y="644" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">第一层从嵌入表取，中间层由上一层算出来。所以注意力代码对所有层都通用。</text>
</svg>
